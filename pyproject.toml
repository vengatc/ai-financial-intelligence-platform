[project]
name = "ai-financial-intelligence-platform"
version = "0.1.0"
description = "AI-powered financial intelligence platform"
authors = [
    { name = "Vengat C" }
]
requires-python = ">=3.13"

dependencies = [
    # Data & ML
    "pandas>=3.0.0",
    "numpy>=2.4.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    # Finance
    "yfinance>=1.5.0",
    # NLP / Transformers
    "transformers>=5.14.0",
    "tokenizers>=0.22.0",
    # Visualization
    "streamlit>=1.60.0",
    "plotly>=6.9.0",
    # Hyperparameter Optimization
    "optuna>=4.9.0",
    # Model Explainability
    "shap>=0.46.0",
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    # API framework
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "torch>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
